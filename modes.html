<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VEILBOUND | Game Modes</title>
  <link rel="stylesheet" href="./waymark-screens.css?v=1">
  <link rel="stylesheet" href="./expedition-dice-art.css?v=fonts-v1">
  <link rel="stylesheet" href="./modes.css?v=mode-console-v6">
  <script type="module" src="./modes.mjs?v=sfx-v2"></script>
</head>
<body>
  <main>
    <header class="masthead">
      <a href="./">Main Menu</a>
      <h1>Game Modes</h1>
    </header>
    <nav aria-label="Game modes">
      <a href="#trials">Accord Trials</a>
      <a href="#weekly">Weekly Oath</a>

      <p id="notice" role="status"></p>

      <div id="encounter"></div>
