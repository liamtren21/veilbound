<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VEILBOUND · Hollow Orchard</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="expedition.css?v=opening-dice-v4">
  <link rel="stylesheet" href="expedition-journey.css?v=loot-inline-v1">
  <link rel="stylesheet" href="expedition-stalls.css?v=shop-portrait-v2">
  <link rel="preload" as="image" href="combat-assets/veilbound-title-logo.png">
  <link rel="preload" as="image" href="combat-assets/veilbound-title-waymark-v2.webp">
  <link rel="stylesheet" href="expedition-cinematics.css?v=loot-motion-v1">
  <link rel="stylesheet" href="expedition-map.css?v=route-marks-v2">
  <link rel="stylesheet" href="expedition-dice-art.css?v=fonts-v1">
</head>
<body>
<div id="title-loading" role="status">
  <img id="boot-logo" src="combat-assets/veilbound-title-logo.png" alt="VEILBOUND" width="1261" height="1247">
  <p>Loading expedition…</p>
  <noscript><p>Enable JavaScript to play VEILBOUND.</p></noscript>
</div>
<main>
  <header class="masthead">
    <div class="location"><h1 id="region-name">Hollow Orchard</h1><span id="purse"></span></div>
    <div class="run-meta">
      <details id="field-guide" class="utility"><summary title="Route legend" aria-label="Route legend">◇</summary><div id="legend" class="popover"></div></details>
      <details id="journal" class="utility combat-utility" hidden>
        <summary class="combat-tool" title="Battle Journal" aria-label="Battle Journal"><span class="combat-tool-icon" aria-hidden="true"></span></summary>
        <section class="popover combat-panel" aria-labelledby="battle-journal-title">
          <h2 id="battle-journal-title">Battle Journal</h2>
          <ol id="battle-log"></ol>
        </section>
      </details>
      <details id="satchel-menu" class="utility combat-utility">
        <summary class="combat-tool" title="Travel Diary" aria-label="Travel Diary"><span class="combat-tool-icon" aria-hidden="true"></span></summary>
        <section class="popover combat-panel" aria-labelledby="battle-satchel-title">
          <h2 id="battle-satchel-title">Travel Diary</h2>
          <p id="satchel"></p>
          <section id="equipment-pouch" aria-label="Equipment pouch"></section>
          <section id="party-panel" aria-label="Expedition party"></section>
        </section>
      </details>
      <button id="settings" class="combat-tool" type="button" aria-label="Settings" title="Settings" aria-haspopup="dialog"><span class="combat-tool-icon" aria-hidden="true"></span></button>
      <small id="save-status" class="sr-only" role="status">Saved on this device</small>
    </div>
  </header>
  <p id="announcement" class="sr-only" role="status"></p>
  <p id="expedition-error" role="alert" hidden></p>
  <section id="travel" class="stage" aria-label="Expedition route">
    <div class="map-surface" id="map">
      <header class="route-heading"><img id="route-emblem" alt="" width="48" height="48"><div><p id="route-chapter">Region 1 of 5</p><h2 id="route-region">Hollow Orchard</h2></div></header>
      <div id="route-scroll" aria-label="Hollow Orchard route map">
        <div class="route-landscape" aria-hidden="true"></div>
        <div id="route-plot">
          <svg id="roads" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true"></svg>
          <div id="nodes"></div>
          <div id="route-marker" aria-hidden="true"></div>
        </div>
      </div>
      <p id="route-readout" role="status"></p>
    </div>
    <img id="travel-scene" class="travel-scene" alt="" hidden>
    <figure id="event-actor" class="event-actor" hidden></figure>
    <img id="shopkeeper" class="shopkeeper" alt="" hidden>
    <aside id="loot-diary" aria-label="Travel Diary" hidden></aside>
    <aside id="decision" class="decision" aria-labelledby="decision-title"></aside>
  </section>
  <section id="combat" class="stage" hidden aria-label="Battle">
    <div class="arena" id="arena">
      <canvas id="battlefield" width="1200" height="560" aria-label="Animated battle arena"></canvas>
      <div id="target-layer" aria-label="Battlefield targets"></div>
      <div id="action-flash" aria-hidden="true"></div>
    </div>
    <div id="battle-outcome" role="status" hidden></div>
    <header class="battle-heading">
      <h2 id="battle-title" class="sr-only"></h2><p id="battle-meta" class="sr-only"></p><span id="boss-warning" class="warning" hidden></span>
      <div id="boss-story-cue" role="status" hidden>
        <img class="route-mark" src="combat-assets/route-mark-story-v2.webp" alt="">
        <span></span>
      </div>
      <p id="roll-status" class="roll-status" role="status" hidden></p>
    </header>
    <div class="battle-hud">
      <section id="command" class="command" aria-label="Selected action" hidden></section>
      <div class="battle-controls">
        <div class="battle-supplies">
          <div id="combat-tokens" aria-label="Combat tokens"></div>
          <button id="reroll" class="turn-button" type="button">Reroll</button>
        </div>
        <div class="dice-pools">
          <span id="companion-status" class="companion-status" hidden></span>
          <div id="party-dice" class="dice" role="group" aria-label="Warden dice"></div>
          <div id="enemy-dice" class="dice" role="group" aria-label="Enemy intent"></div>
        </div>
        <button id="end-round" class="turn-button" type="button">End Turn</button>
        <details class="reserve utility"><summary title="Reserve and Brace" aria-label="Reserve and Brace">✥</summary><div id="reserve" class="popover"></div></details>
      </div>
    </div>
  </section>
</main>
<dialog id="confirmation">
  <form method="dialog">
    <h2 id="confirm-title"></h2><p id="confirm-copy"></p>
    <div class="button-row"><button value="cancel" class="secondary">Cancel</button><button value="confirm">Confirm</button></div>
  </form>
</dialog>
<script type="module" src="expedition.mjs?v=crowns-v1"></script>
</body>
</html>
